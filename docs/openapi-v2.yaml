            examples:
              sample:
                value:
                  key: value
      security:
        - BearerAuth: []
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              examples:
                ok:
                  value:
                    code: 9999
                    msg: ok
                    result: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/GenericError"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: PAT_OR_UAT
      description: PAT/UAT token in `Authorization: Bearer <token>`
    SessionCookie:
      type: apiKey
      in: cookie
      name: laravel_session
  schemas:
    ApiResponse:
      type: object
      additionalProperties: true
      properties:
        code:
          type: integer
          example: 9999
        msg:
          type: string
          example: ok
        result:
          nullable: true
          description: business payload (varies by endpoint)
    ErrorResponse:
      type: object
      additionalProperties: true
      properties:
        code:
          type: integer
          example: 1000
        msg:
          type: string
          example: unauthorized
        result:
          nullable: true
    FlexibleObject:
      type: object
      additionalProperties: true
  responses:
    Unauthorized:
      description: authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: token lacks required capability
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    GenericError:
      description: unexpected error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

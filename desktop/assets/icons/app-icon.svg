<!-- 应用图标 SVG -->
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b894;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a085;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="128" cy="128" r="120" fill="url(#primaryGradient)" />
  
  <!-- GTD 文字 -->
  <text x="128" y="140" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
        fill="white" text-anchor="middle" dominant-baseline="middle">
    GTD
  </text>
  
  <!-- 装饰性元素 - 番茄钟轮廓 -->
  <circle cx="128" cy="128" r="100" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4" />
  
  <!-- 顶部小圆点 -->
  <circle cx="128" cy="28" r="8" fill="white" opacity="0.8" />
</svg>

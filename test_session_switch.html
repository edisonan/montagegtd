<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会话切换测试</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #f8fafc;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            padding: 20px;
            background: #3b82f6;
            color: white;
            text-align: center;
        }

        .content {
            display: flex;
            min-height: 500px;
        }

        /* 左侧会话列表 */
        .session-list {
            width: 300px;
            border-right: 1px solid #e2e8f0;
            background: #f8fafc;
        }

        .session-header {
            padding: 16px;
            border-bottom: 1px solid #e2e8f0;
            background: white;
        }

        .session-items {
            padding: 8px;
            max-height: 400px;
            overflow-y: auto;
        }

        .session-item {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: white;
            border: 1px solid #e2e8f0;
        }

        .session-item:hover {
            background: #eff6ff;
            border-color: #3b82f6;
        }

        .session-item.active {
            background: #dbeafe;
            border-color: #3b82f6;
        }

        .session-title {
            font-weight: 500;
            color: #1e293b;
            margin-bottom: 4px;
        }

        .session-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #64748b;
        }

        /* 右侧聊天区域 */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid #e2e8f0;
            background: white;
        }

        .messages-container {
            flex: 1;
            overflow: hidden;
            background: white;
        }

        #messages-list {
            height: 100%;
            overflow-y: auto;
            padding: 16px;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
        }

        .message.user {
            justify-content: flex-start;
        }

        .message.ai {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
        }

        .user .bubble {
            background: #3b82f6;
            color: white;
            border-bottom-left-radius: 4px;
        }

        .ai .bubble {
            background: #f1f5f9;
            color: #1e293b;
            border-bottom-right-radius: 4px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #64748b;
        }

        .controls {
            padding: 20px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            text-align: center;
        }

        .btn {
            padding: 10px 20px;
            margin: 0 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-secondary {
            background: #64748b;
            color: white;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .status {
            padding: 12px;
            margin: 16px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }

        .status-info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #93c5fd;
        }

        .status-success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .status-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>会话切换功能测试</h1>
        </div>
        
        <div class="content">
            <!-- 左侧会话列表 -->
            <div class="session-list">
                <div class="session-header">
                    <h3>对话列表</h3>
                </div>
                <div class="session-items" id="sessions-list">
                    <div class="loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>加载中...</p>
                    </div>
                </div>
            </div>

            <!-- 右侧聊天区域 -->
            <div class="chat-area">
                <div class="chat-header">
                    <h3 id="current-session">请选择会话</h3>
                </div>
                <div class="messages-container">
                    <div id="messages-list">
                        <div class="status status-info">
                            请选择左侧的会话开始测试
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="loadMockSessions()">加载测试会话</button>
            <button class="btn btn-secondary" onclick="clearAll()">清空</button>
        </div>
    </div>

    <script>
        // 全局变量
        let currentSessionId = null;
        let sessions = [];

        // 模拟会话数据
        const mockSessions = [
            {
                id: 'session_1',
                title: '技术问题咨询',
                agent_name: '代码助手',
                updated_at: new Date(Date.now() - 3600000).toISOString(),
                messages: [
                    { role: 'user', content: '如何优化JavaScript性能？' },
                    { role: 'ai', content: '优化JavaScript性能可以从以下几个方面入手：\n\n1. **减少DOM操作** - 批量更新DOM，使用文档片段\n2. **合理使用事件委托** - 避免为每个元素绑定事件\n3. **优化循环** - 缓存数组长度，减少不必要的计算\n4. **使用Web Workers** - 将耗时操作放到后台线程' }
                ]
            },
            {
                id: 'session_2',
                title: '写作创作讨论',
                agent_name: '写作助手',
                updated_at: new Date(Date.now() - 7200000).toISOString(),
                messages: [
                    { role: 'user', content: '帮我写一篇关于人工智能的文章开头' },
                    { role: 'ai', content: '在数字化浪潮席卷全球的今天，人工智能如同一颗璀璨的新星，正在重塑着人类社会的方方面面。从智能手机中的语音助手到自动驾驶汽车，从医疗诊断到金融风控，AI技术已经悄然渗透到我们生活的每个角落。\n\n这不仅仅是一场技术革命，更是人类认知边界的一次重大突破。当我们创造出能够学习、推理甚至创新的机器时，我们实际上是在重新定义智能的本质，也在重新审视人类在宇宙中的独特地位。' }
                ]
            },
            {
                id: 'session_3',
                title: '日常闲聊',
                agent_name: '通用助手',
                updated_at: new Date(Date.now() - 86400000).toISOString(),
                messages: [
                    { role: 'user', content: '今天天气怎么样？' },
                    { role: 'ai', content: '您好！我是通用助手，很乐意为您服务。不过我无法获取实时天气信息，建议您查看天气预报应用或网站获取准确的天气情况。有什么其他我可以帮助您的吗？' }
                ]
            }
        ];

        // 格式化时间
        function formatTime(timestamp) {
            if (!timestamp) return '';
            
            const date = new Date(timestamp);
            const now = new Date();
            const diffMs = now - date;
            const diffHours = diffMs / (1000 * 60 * 60);
            const diffDays = diffHours / 24;

            if (diffHours < 1) {
                return '刚刚';
            } else if (diffHours < 24) {
                return Math.floor(diffHours) + '小时前';
            } else if (diffDays < 7) {
                return Math.floor(diffDays) + '天前';
            } else {
                return date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
            }
        }

        // 显示会话列表
        function displaySessions(sessionList) {
            const container = document.getElementById('sessions-list');
            
            if (!sessionList || sessionList.length === 0) {
                container.innerHTML = `
                    <div class="status status-info">
                        <p>暂无会话记录</p>
                    </div>
                `;
                return;
            }

            let html = '';
            sessionList.forEach(session => {
                const isActive = currentSessionId === session.id;
                html += `
                    <div class="session-item ${isActive ? 'active' : ''}" data-session-id="${session.id}">
                        <div class="session-title">${session.title}</div>
                        <div class="session-meta">
                            <span>${formatTime(session.updated_at)}</span>
                            <span>${session.agent_name}</span>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // 切换到指定会话
        async function switchToSession(sessionId) {
            try {
                // 显示加载状态
                showLoading();
                
                // 模拟网络延迟
                await new Promise(resolve => setTimeout(resolve, 800));
                
                // 查找会话
                const session = sessions.find(s => s.id === sessionId);
                if (!session) {
                    throw new Error('会话不存在');
                }

                currentSessionId = sessionId;
                
                // 更新UI
                document.getElementById('current-session').textContent = session.title;
                displaySessions(sessions);
                
                // 显示历史消息
                displayMessages(session.messages);
                
                showStatus(`已加载会话 "${session.title}"，共 ${session.messages.length} 条消息`, 'success');
                
            } catch (error) {
                console.error('切换会话失败:', error);
                showStatus('切换会话失败: ' + error.message, 'error');
            }
        }

        // 显示消息
        function displayMessages(messages) {
            const container = document.getElementById('messages-list');
            
            if (!messages || messages.length === 0) {
                container.innerHTML = `
                    <div class="status status-info">
                        <p>该会话暂无消息</p>
                    </div>
                `;
                return;
            }

            let html = '';
            messages.forEach(msg => {
                const role = msg.role === 'user' ? 'user' : 'ai';
                html += `
                    <div class="message ${role}">
                        <div class="bubble">
                            ${msg.content}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            
            // 滚动到底部
            container.scrollTop = container.scrollHeight;
        }

        // 显示加载状态
        function showLoading() {
            document.getElementById('messages-list').innerHTML = `
                <div class="loading">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p>正在加载会话历史...</p>
                </div>
            `;
        }

        // 显示状态消息
        function showStatus(message, type = 'info') {
            const statusDiv = document.createElement('div');
            statusDiv.className = `status status-${type}`;
            statusDiv.textContent = message;
            
            const container = document.getElementById('messages-list');
            container.insertBefore(statusDiv, container.firstChild);
            
            // 3秒后自动移除
            setTimeout(() => {
                if (statusDiv.parentNode) {
                    statusDiv.remove();
                }
            }, 3000);
        }

        // 加载测试会话
        function loadMockSessions() {
            sessions = [...mockSessions];
            displaySessions(sessions);
            showStatus('测试会话加载成功', 'success');
        }

        // 清空所有内容
        function clearAll() {
            currentSessionId = null;
            sessions = [];
            document.getElementById('current-session').textContent = '请选择会话';
            document.getElementById('sessions-list').innerHTML = `
                <div class="status status-info">
                    <p>暂无会话记录</p>
                </div>
            `;
            document.getElementById('messages-list').innerHTML = `
                <div class="status status-info">
                    <p>请选择左侧的会话开始测试</p>
                </div>
            `;
        }

        // 初始化事件委托
        document.addEventListener('DOMContentLoaded', function() {
            // 使用事件委托处理会话列表点击
            document.getElementById('sessions-list').addEventListener('click', function(e) {
                const sessionItem = e.target.closest('.session-item');
                if (sessionItem) {
                    const sessionId = sessionItem.dataset.sessionId;
                    if (sessionId) {
                        switchToSession(sessionId);
                    }
                }
            });
        });
    </script>
</body>
</html>
